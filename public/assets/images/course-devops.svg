      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <pattern id="grid_course-devops" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#grad_course-devops)" />
  <rect width="600" height="360" fill="url(#grid_course-devops)" />
  
  <circle cx="520" cy="80" r="140" fill="rgba(255,255,255,0.05)" />
  <circle cx="80" cy="300" r="100" fill="rgba(0,0,0,0.15)" />

  <!-- Category Tag -->
  <rect x="40" y="45" width="180" height="28" rx="14" fill="rgba(255,255,255,0.2)" />
  <text x="130" y="63" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CLOUD & DEVOPS</text>

  <!-- Title & Subtitle -->
  <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Docker & CI/CD Pipeline</text>
  <text x="40" y="175" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.85)">Containerization & Cloud</text>

