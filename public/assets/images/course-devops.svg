  <text x="120" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">⚡ DOCKER / DEVOPS</text>

  <rect x="220" y="270" width="140" height="40" rx="8" fill="rgba(255,255,255,0.15)" />
  <text x="290" y="295" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">ONLINE COURSE</text>
