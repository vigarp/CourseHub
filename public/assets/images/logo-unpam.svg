<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="unpamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <linearGradient id="unpamBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399" />
      <stop offset="100%" stop-color="#001F5C" />
    </linearGradient>
  </defs>
  <!-- Outer Lotus / Gear petals -->
  <circle cx="80" cy="80" r="76" fill="url(#unpamGold)" stroke="#CC8800" stroke-width="2"/>
  <!-- Dark Blue Outer Ring -->
  <circle cx="80" cy="80" r="64" fill="url(#unpamBlue)"/>
  <!-- Gold Inner Ring -->
  <circle cx="80" cy="80" r="48" fill="#FFFFFF" stroke="url(#unpamGold)" stroke-width="4"/>
  <!-- Center Star / Torch symbol -->
  <polygon points="80,42 86,58 103,58 90,69 95,85 80,75 65,85 70,69 57,58 74,58" fill="#E65100"/>
  <!-- Small Book at bottom of center -->
  <path d="M68 96 Q80 90 92 96 L92 108 Q80 102 68 108 Z" fill="url(#unpamBlue)"/>
  <path d="M80 93 L80 105" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Ring text representation -->
  <text x="80" y="32" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="1.5">UNIVERSITAS PAMULANG</text>
  <text x="80" y="136" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#FFD700" text-anchor="middle" letter-spacing="1.5">SASMITA JAYA</text>
</svg>
